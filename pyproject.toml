[project]
name = "simforge"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "numba>=0.58",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13.0"]  # nur wenn CUDA-Server; KernelArray fällt sonst auf NumPy zurück

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["simcore"]